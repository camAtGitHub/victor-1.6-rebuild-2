<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console Vars &amp; Functions</title>
  <link rel="stylesheet" href="jquery-ui.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --cv-bg: #0c0f14;
      --cv-elev: #12161e;
      --cv-panel: #161b24;
      --cv-line: #2a3344;
      --cv-text: #e8edf5;
      --cv-dim: #8b95a8;
      --cv-faint: #5c667a;
      --cv-accent: #5b9fd4;
      --cv-accent-dim: rgba(91, 159, 212, 0.14);
      --cv-good: #3ecf8e;
      --cv-warn: #e6b450;
      --cv-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --cv-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --cv-radius: 8px;
    }
    * { box-sizing: border-box; }
    body.cv-body {
      margin: 0;
      min-height: 100vh;
      font: 13px/1.45 var(--cv-sans);
      background: var(--cv-bg);
      color: var(--cv-text);
    }
    /* Override legacy style.css / jQuery UI noise for this page */
    body.cv-body .ui-widget-content { background: transparent; border: 0; color: inherit; }
    body.cv-body .ui-widget-header { background: transparent; border: 0; color: inherit; }
    body.cv-body .ui-tabs .ui-tabs-nav { background: var(--cv-elev); border: 1px solid var(--cv-line); border-radius: var(--cv-radius); padding: 6px; }
    body.cv-body .ui-tabs .ui-tabs-nav li { margin: 2px; }
    body.cv-body .ui-tabs .ui-tabs-nav li a { color: var(--cv-dim); font-size: 12px; padding: 6px 10px; }
    body.cv-body .ui-tabs .ui-tabs-nav li.ui-tabs-active a { color: var(--cv-text); }
    body.cv-body .ui-tabs .ui-tabs-panel { background: var(--cv-panel); border: 1px solid var(--cv-line); border-radius: var(--cv-radius); margin-top: 10px; padding: 14px; color: var(--cv-text); }
    body.cv-body fieldset { border: 1px solid var(--cv-line); border-radius: 6px; margin: 10px 0; padding: 10px 12px; }
    body.cv-body legend { color: var(--cv-accent); font-weight: 600; padding: 0 6px; }
    body.cv-body label { color: var(--cv-text); font-family: var(--cv-mono); font-size: 12px; margin-right: 8px; }
    body.cv-body input[type="text"], body.cv-body select {
      background: #0e1218; color: var(--cv-text); border: 1px solid var(--cv-line); border-radius: 4px; padding: 4px 6px;
    }
    body.cv-body .ui-slider { background: #1a2030; border-color: var(--cv-line); }
    body.cv-body .ui-slider .ui-slider-handle { background: var(--cv-accent); border-color: var(--cv-accent); }

    .cv-app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100vh;
      gap: 0;
    }
    .cv-top {
      grid-column: 1 / -1;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      padding: 10px 14px;
      background: var(--cv-elev);
      border-bottom: 1px solid var(--cv-line);
    }
    .cv-brand { font-weight: 600; letter-spacing: -0.02em; }
    .cv-brand em { font-style: normal; color: var(--cv-dim); font-weight: 500; font-size: 12px; margin-left: 6px; }
    .cv-badge {
      font-family: var(--cv-mono); font-size: 11px;
      padding: 3px 10px; border-radius: 999px;
      background: var(--cv-panel); border: 1px solid var(--cv-line); color: var(--cv-dim);
    }
    .cv-badge-engine { border-color: rgba(91,159,212,.45); color: var(--cv-accent); }
    .cv-badge-anim { border-color: rgba(199,146,234,.45); color: #c792ea; }
    .cv-search {
      flex: 1; min-width: 160px; max-width: 320px;
      display: flex; align-items: center; gap: 6px;
      background: #0e1218; border: 1px solid var(--cv-line); border-radius: 6px; padding: 4px 10px;
    }
    .cv-search input {
      flex: 1; border: 0; background: transparent; color: var(--cv-text); outline: none; font-size: 13px;
    }
    .cv-search input::placeholder { color: var(--cv-faint); }
    .cv-top a { color: var(--cv-dim); font-size: 12px; }
    .cv-top a:hover { color: var(--cv-accent); }
    .cv-status { font-family: var(--cv-mono); font-size: 11px; color: var(--cv-faint); width: 100%; }

    .cv-main {
      padding: 14px;
      overflow: auto;
      min-width: 0;
    }
    .cv-side {
      border-left: 1px solid var(--cv-line);
      background: var(--cv-elev);
      padding: 12px;
      overflow: auto;
      min-height: 0;
    }
    .cv-side h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--cv-faint); margin: 0 0 10px;
    }
    .cv-muted { color: var(--cv-dim); font-size: 12px; }
    .cv-recipe {
      background: var(--cv-panel);
      border: 1px solid var(--cv-line);
      border-radius: var(--cv-radius);
      padding: 12px;
      margin-bottom: 12px;
    }
    .cv-recipe h3 { margin: 0 0 6px; font-size: 13px; }
    .cv-blurb { color: var(--cv-dim); font-size: 12px; margin: 0 0 8px; }
    .cv-where { font-family: var(--cv-mono); font-size: 10px; color: var(--cv-faint); margin: 0 0 8px; }
    .cv-steps { margin: 0 0 8px 1.1em; padding: 0; font-size: 12px; }
    .cv-steps code { font-family: var(--cv-mono); color: var(--cv-accent); font-size: 11px; }
    .cv-step-note { display: block; color: var(--cv-faint); font-size: 11px; margin: 2px 0 6px; }
    .cv-tips { margin: 0 0 10px 1.1em; padding: 0; color: var(--cv-dim); font-size: 11px; }
    .cv-recipe-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .cv-btn {
      cursor: pointer; border: 1px solid var(--cv-line); background: var(--cv-bg);
      color: var(--cv-dim); border-radius: 6px; padding: 5px 10px; font-size: 12px;
    }
    .cv-btn:hover { color: var(--cv-text); border-color: #3a465c; }
    .cv-btn-primary { background: var(--cv-accent-dim); border-color: var(--cv-accent); color: var(--cv-accent); }
    .cv-meta {
      display: block; width: 100%; margin: 4px 0 10px 0;
      padding: 8px 10px; border-radius: 6px;
      background: rgba(91, 159, 212, 0.08); border-left: 3px solid var(--cv-accent);
    }
    .cv-meta .cv-blurb { margin: 0 0 4px; }
    .cv-requires, .cv-related { margin: 4px 0 0; font-size: 11px; color: var(--cv-dim); }
    .cv-linkvar {
      cursor: pointer; border: 0; background: transparent; color: var(--cv-accent);
      font-family: var(--cv-mono); font-size: 11px; text-decoration: underline; padding: 0 2px;
    }
    .cv-cat-blurb { color: var(--cv-dim); font-size: 12px; margin: 0 0 10px; max-width: 70ch; }
    .cv-highlight { /* annotated highlight vars */
      outline: 1px solid rgba(62, 207, 142, 0.25);
      border-radius: 4px;
      padding: 4px 6px 2px !important;
      background: rgba(62, 207, 142, 0.05);
    }
    .cv-flash {
      animation: cv-flash 1.6s ease;
      outline: 2px solid var(--cv-warn) !important;
      background: rgba(230, 180, 80, 0.12) !important;
    }
    @keyframes cv-flash {
      0%, 100% { outline-color: var(--cv-warn); }
      50% { outline-color: var(--cv-accent); }
    }
    .cv-console-out {
      margin-top: 16px; padding: 10px; border-radius: 6px;
      background: #0e1218; border: 1px solid var(--cv-line);
      font-family: var(--cv-mono); font-size: 11px; color: var(--cv-dim);
    }
    /* C++ used display:inline-block on all divs — force block layout for meta + rows */
    body.cv-body #tabs div.cv-row,
    body.cv-body #tabs div.cv-meta,
    body.cv-body #tabs fieldset,
    body.cv-body #tabs .cv-cat-blurb { display: block; }
    body.cv-body #tabs > div > div {
      display: inline-block;
      vertical-align: top;
      color: var(--cv-text);
    }
    @media (max-width: 960px) {
      .cv-app { grid-template-columns: 1fr; }
      .cv-side { border-left: 0; border-top: 1px solid var(--cv-line); max-height: 40vh; }
    }
/* -- generated style -- */
  </style>
  <script src="jquery-1.12.4.js"></script>
  <script src="jquery-ui.js"></script>
  <script>
    function onCheckboxClickHandler(element) {
      $.post("consolevarset", { key: element.id, value: element.checked }, function () {});
    }

    function newlineToBr(str) {
      if (str == null) return "";
      return String(str).replace(/\n/g, "<br>");
    }

    $(function () {
      // Tabs are initialized in consolevars-app.js (#tabs preferred)

      $(".slider").each(function () {
        var scale = $(this).data("scale"),
          value = $(this).data("value"),
          begin = $(this).data("begin"),
          end = $(this).data("end");
        $(this).slider({
          value: value * scale,
          min: begin * scale,
          max: end * scale,
          slide: function (event, ui) {
            var selector = "#" + $(this).attr("id") + "_amount",
              scale = $(this).data("scale"),
              value = ui.value / scale;
            $(selector).val(value);
            $.post("consolevarset", { key: $(this).attr("id"), value: value }, function () {});
          },
        });
        $("#" + $(this).attr("id") + "_amount").val(value);
      });

      $(".amount").change(function () {
        var selector = $("#" + this.id.split("_amount")[0]),
          scale = selector.data("scale"),
          value = this.value;
        selector.slider("value", value * scale);
        $.post("consolevarset", { key: selector.attr("id"), value: value }, function () {});
      });

      $(".listbox").each(function () {
        var selector = $("#" + this.id);
        $(this).selectmenu({
          change: function (event, data) {
            $.post("consolevarset", { key: selector.attr("id"), value: data.item.index }, function () {});
          },
        });
      });

      $(".function").click(function () {
        var func, args;
        if (this.id != "") {
          func = this.id.split("_function")[0];
          args = $("#" + func + "_args").val();
        } else {
          func = this.value;
          args = "";
        }
        var optionsString = "func=" + func + "&args=" + args;
        $.post("consolefunccall", optionsString, function (result) {
          $("#id_consolefunc_result").html(newlineToBr(result));
        });
      });
    });
// -- generated script --
  </script>
</head>
<body class="cv-body ui-widget-content" style="border:0;">
  <div class="cv-app">
    <header class="cv-top">
      <div class="cv-brand">Console vars <em>&amp; functions</em></div>
      <span class="cv-badge" id="cvProcessBadge">…</span>
      <label class="cv-search">
        <span style="color:var(--cv-faint);font-size:11px">Filter</span>
        <input type="search" id="cvSearch" placeholder="Faces, MirrorMode, Mood…" autocomplete="off" />
      </label>
      <a href="/">Home</a>
      <a href="/webViz.html">WebViz</a>
      <div class="cv-status" id="cvStatus">Loading catalog…</div>
    </header>

    <main class="cv-main" id="main">
      <!-- C++ injects jQuery UI tabs markup at the next comment -->
<!-- generated html -->
      <div class="cv-console-out">
        <div>Output from last console func call:</div>
        <div id="id_consolefunc_result"></div>
      </div>
    </main>

    <aside class="cv-side" aria-label="Recipes and notes">
      <h2>Recipes (curated)</h2>
      <p class="cv-muted" style="margin-top:0">
        Not every var is documented — only high-signal paths. Add entries in
        <code>consolevars-catalog.json</code>. Apply posts <code>consolevarset</code> for each step.
      </p>
      <div id="cvRecipes"></div>
    </aside>
  </div>
  <script src="consolevars-app.js"></script>
</body>
</html>
