    <!-- FOUC: set data-theme + class before any stylesheet that uses tokens -->
    <script>
    (function () {
      var root = document.documentElement;
      var dark = true;
      try {
        var p = localStorage.getItem("webviz.colorScheme") || "system";
        if (p === "light") dark = false;
        else if (p === "dark") dark = true;
        else if (window.matchMedia) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
      } catch (e) {
        dark = true;
      }
      var t = dark ? "dark" : "light";
      root.setAttribute("data-theme", t);
      root.classList.remove("wv-theme-light", "wv-theme-dark");
      root.classList.add(dark ? "wv-theme-dark" : "wv-theme-light");
      /* Inline light vars early so paint is correct even if tokens.css is cached without light block */
      if (!dark) {
        var L = {
          "--wv-bg": "#f0f2f6",
          "--wv-bg-elev": "#ffffff",
          "--wv-bg-panel": "#e8ecf2",
          "--wv-bg-hover": "#dde3ec",
          "--wv-bg-active": "#d0d8e4",
          "--wv-bg-input": "#ffffff",
          "--wv-line": "#c5ccd8",
          "--wv-line-soft": "#d8dee8",
          "--wv-line-strong": "#9aa6b8",
          "--wv-text": "#1a1d24",
          "--wv-text-dim": "#5c667a",
          "--wv-text-faint": "#8b95a8",
          "--wv-text-inv": "#ffffff",
          "--wv-accent-strong": "#3d87c4",
          "--wv-content-bg": "#ffffff",
          "--wv-content-text": "#1a1d24",
          "--wv-content-line": "#c5cad3",
          "--wv-toast-error-bg": "#fdecee",
          "--wv-shadow-sm": "0 1px 2px rgba(0,0,0,0.08)",
          "--wv-shadow-md": "0 8px 24px rgba(0,0,0,0.1)"
        };
        for (var k in L) {
          if (Object.prototype.hasOwnProperty.call(L, k)) root.style.setProperty(k, L[k]);
        }
        try { root.style.setProperty("color-scheme", "light"); } catch (e2) {}
      } else {
        try { root.style.setProperty("color-scheme", "dark"); } catch (e3) {}
      }
    })();
    </script>

    function onCheckboxClickHandler(element){
        $.post("consolevarset", {key: element.id, value: element.checked}, function(result){});
    }

    $(function() {
        $(".slider").each(function() {
            var scale = $(this).data("scale"),
                value = $(this).data("value"),
                begin = $(this).data("begin"),
                end = $(this).data("end");
            $(this).slider({
                value: value*scale,
                min: begin*scale,
                max: end*scale,
                slide: function(event, ui) {
                    // when slider changes, update text box
                    var selector = ("#" + $(this).attr("id") + "_amount"),
                        scale = $(this).data("scale"),
                        value = ui.value/scale;
                    $(selector).val(value);
                    $.post("consolevarset", {key: $(this).attr("id"), value: value}, function(result){});
                }
            })
            //initialise text box quantity
            var slideramount = ("#" + $(this).attr("id") + "_amount");
            //$(slideramount).val($(this).slider("value"));
            $(slideramount).val(value);
        })
        // when text box is changed, update slider
        $(".amount").change(function() {
            var selector = $("#" + this.id.split('_amount')[0]),
                scale = selector.data("scale"),
                value = this.value;
            selector.slider("value", value*scale);
            $.post("consolevarset", {key: selector.attr("id"), value: value}, function(result){});
        })
        // when list box is changed
        $(".listbox").each(function() {
            var selector = $("#" + this.id);
            $(this).selectmenu({
               change: function(event, data) {
                   $.post("consolevarset", {key: selector.attr("id"), value: data.item.index}, function(result){});
               }
            });
        })
        // when function call button is clicked, get arguments from text box, and call function
        $(".function").click(function() {
            if (this.id != "") {
                var func = this.id.split('_function')[0];
                var argsId = func + "_args";
                var selector = ("#" + argsId);
                var args = $(selector).val();
            } else {
                var func = this.value;
                var args = "";
            }
            console.log("Call consolefunccall with func:" + func + " and args:" + args);
            // Passing as string (instead of json object) prevents encoding of commas
            var optionsString = "func=" + func + "&args=" + args;
            $.post("consolefunccall", optionsString, function(result){
              $("#id_consolefunc_result").html(newlineToBr(result));
            });
        })
    });
// -- generated script --
    </script>
